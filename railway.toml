# Railway Production Configuration
#
# REQUIRED SERVICES (create these in Railway UI):
#
# 1. API Service:
#    Start Command: python -m app.main
#    Port: 8000
#
# 2. Worker Service:
#    Start Command: celery -A app.core.celery_app.celery worker --loglevel=info
#    No port needed
#
# 3. Beat Service:
#    Start Command: celery -A app.core.celery_app.celery beat --loglevel=info
#    No port needed
#
# 4. Redis Plugin (provides REDIS_URL env var)
#
# REQUIRED ENV VARS:
# - REDIS_URL (from Redis plugin)
# - DATABASE_URL (from Postgres plugin)
# - HIGH_RECALL_MODE=true (for Kenya pipeline)
# - SERPAPI_API_KEY

[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m app.main"
restartPolicyType = "on_failure"

# Cache buster - change timestamp to force rebuild
cache_buster = "2026-02-27T21:00:00Z"
