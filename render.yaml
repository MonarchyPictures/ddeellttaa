services:
  - type: web
    name: delta-9-api
    runtime: python
    buildCommand: cd frontend && npm install && npm run build && cd ..
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: delta-9-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
