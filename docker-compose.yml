# ============================================================================
# DELTA 9 - Production Docker Compose
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: delta9-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delta9}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delta9secret}
      POSTGRES_DB: ${POSTGRES_DB:-delta9}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delta9} -d ${POSTGRES_DB:-delta9}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - delta9-network
    restart: unless-stopped

  # ==========================================================================
  # Redis Cache & Message Broker
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: delta9-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - delta9-network
    restart: unless-stopped

  # ==========================================================================
  # Main API Application
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta9-api
    environment:
      # Application
      APP_NAME: ${APP_NAME:-Delta 9}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      
      # Server
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${WORKERS:-2}
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-delta9}:${POSTGRES_PASSWORD:-delta9secret}@postgres:5432/${POSTGRES_DB:-delta9}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-immediately}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALGORITHM: ${ALGORITHM:-HS256}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      
      # Search & Scraping
      MIN_INTENT_SCORE: ${MIN_INTENT_SCORE:-0.18}
      MAX_SEARCH_RESULTS: ${MAX_SEARCH_RESULTS:-50}
      SEARCH_TIMEOUT: ${SEARCH_TIMEOUT:-30}
      SCRAPER_TIMEOUT: ${SCRAPER_TIMEOUT:-8}
      
      # API Keys
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
      
      # Telegram
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_SESSION_NAME: ${TELEGRAM_SESSION_NAME:-delta9_session}
      
      # AI
      AI_ENABLED: ${AI_ENABLED:-false}
      
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN:-}
      
      # Kenya
      DEFAULT_LOCATION: ${DEFAULT_LOCATION:-Kenya}
      KENYA_LOCK_ENABLED: ${KENYA_LOCK_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - delta9-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Celery Worker
  # ==========================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta9-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-delta9}:${POSTGRES_PASSWORD:-delta9secret}@postgres:5432/${POSTGRES_DB:-delta9}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-immediately}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MIN_INTENT_SCORE: ${MIN_INTENT_SCORE:-0.18}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - delta9-network
    restart: unless-stopped

  # ==========================================================================
  # Celery Beat (Scheduler)
  # ==========================================================================
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta9-beat
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-delta9}:${POSTGRES_PASSWORD:-delta9secret}@postgres:5432/${POSTGRES_DB:-delta9}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-immediately}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - delta9-network
    restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  delta9-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
