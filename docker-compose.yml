# DELTA-9 DOCKER COMPOSE
# Complete stack with PostgreSQL, Redis, and the application

version: '3.8'

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: delta9_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-delta9}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-delta9_secret}
      POSTGRES_DB: ${DB_NAME:-delta9}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-delta9} -d ${DB_NAME:-delta9}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delta9_network

  # ===========================================================================
  # Redis Cache & Queue
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: delta9_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delta9_network

  # ===========================================================================
  # Delta-9 Backend API
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: delta9_backend
    restart: always
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-delta9}:${DB_PASSWORD:-delta9_secret}@postgres:5432/${DB_NAME:-delta9}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      
      # App Settings
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      
      # API Keys
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      SERPAPI_KEY: ${SERPAPI_KEY}
      
      # Scraper Settings
      SCRAPER_INTERVAL: ${SCRAPER_INTERVAL:-300}
      MAX_LEADS_PER_RUN: ${MAX_LEADS_PER_RUN:-100}
      
      # Guardian Settings
      GUARDIAN_ENABLED: ${GUARDIAN_ENABLED:-true}
      GUARDIAN_INTERVAL: ${GUARDIAN_INTERVAL:-60}
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - delta9_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # System Guardian (Self-Healing Monitor)
  # ===========================================================================
  guardian:
    build:
      context: .
      dockerfile: Dockerfile.guardian
    container_name: delta9_guardian
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-delta9}:${DB_PASSWORD:-delta9_secret}@postgres:5432/${DB_NAME:-delta9}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      CHECK_INTERVAL: ${GUARDIAN_INTERVAL:-60}
    depends_on:
      - backend
      - postgres
      - redis
    networks:
      - delta9_network

  # ===========================================================================
  # Frontend (React)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delta9_frontend
    restart: always
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - delta9_network

  # ===========================================================================
  # Nginx Reverse Proxy (Production)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: delta9_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - delta9_network
    profiles:
      - production

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  delta9_network:
    driver: bridge
