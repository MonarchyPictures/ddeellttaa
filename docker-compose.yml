# Delta 9 - Distributed Scraper Workers
# Local Development with Docker Compose

version: "3.8"

services:
  # Redis - Task Queue & Result Backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Main Database (optional, SQLite used by default)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: delta9
      POSTGRES_PASSWORD: delta9pass
      POSTGRES_DB: delta9
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delta9"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile.railway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://delta9:delta9pass@postgres:5432/delta9
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker - Scraper Queue
  worker-scrapers:
    build:
      context: .
      dockerfile: Dockerfile.railway
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://delta9:delta9pass@postgres:5432/delta9
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.core.celery_config.celery_app worker -Q scrapers -n scraper@%h --loglevel=info --concurrency=2
    volumes:
      - ./:/app

  # Celery Worker - Default Queue
  worker-default:
    build:
      context: .
      dockerfile: Dockerfile.railway
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://delta9:delta9pass@postgres:5432/delta9
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.core.celery_config.celery_app worker -Q default -n default@%h --loglevel=info --concurrency=2
    volumes:
      - ./:/app

  # Celery Worker - High Priority Queue
  worker-high:
    build:
      context: .
      dockerfile: Dockerfile.railway
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://delta9:delta9pass@postgres:5432/delta9
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.core.celery_config.celery_app worker -Q high_priority -n high@%h --loglevel=info --concurrency=4
    volumes:
      - ./:/app

  # Celery Beat - Scheduled Tasks
  beat:
    build:
      context: .
      dockerfile: Dockerfile.railway
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://delta9:delta9pass@postgres:5432/delta9
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.core.celery_config.celery_app beat --loglevel=info
    volumes:
      - ./:/app

  # Flower - Celery Monitoring UI
  flower:
    build:
      context: .
      dockerfile: Dockerfile.railway
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_config.celery_app flower --port=5555

volumes:
  redis_data:
  postgres_data:
