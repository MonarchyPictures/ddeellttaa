# DELTA-9 LOCAL DOCKER COMPOSE
# Simplified stack for local development

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: delta9_postgres
    restart: always
    environment:
      POSTGRES_USER: delta9
      POSTGRES_PASSWORD: delta9_secret
      POSTGRES_DB: delta9
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delta9"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: delta9_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta9_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://delta9:delta9_secret@postgres:5432/delta9
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: local-dev-secret
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app  # Hot reload
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  # Frontend (Optional - can also run locally with npm)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delta9_frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
